# Cowrie v3.1.2 (56b2abb3b02fcb53980334f77daa0fe570f5e4be).
# Download functionality is removed by the base-only commands registry mount.
# download_limit_size=0 does NOT disable downloads and is intentionally unused.
[honeypot]
backend = shell
hostname = server
sensor_name = cheesetrap
auth_class = UserDB
log_path = var/log/cowrie
state_path = var/lib/cowrie
# JSONL is the managed raw record; do not create separate terminal transcripts.
ttylog = false
internet_facing_ip = PUBLIC_IPV4
idle_timeout = 30
[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
public_key_auth = ssh-ed25519
sftp_enabled = false
forwarding = false
forward_redirect = false
forward_tunnel = false
auth_keyboard_interactive_enabled = false
[telnet]
enabled = false
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

# Diagnostics go to bounded Docker stdout via the pinned image entry point.
[output_textlog]
enabled = false
