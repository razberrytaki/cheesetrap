version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/store/sqlc-schema.sql
      - migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
