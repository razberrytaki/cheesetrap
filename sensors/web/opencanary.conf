{
  "device.node_id": "cheesetrap-web",
  "device.listen_addr": "0.0.0.0",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],
  "http.enabled": true,
  "http.port": 8080,
  "http.skin": "nasLogin",
  "https.enabled": true,
  "https.port": 8443,
  "https.skin": "nasLogin",
  "https.certificate": "/run/cheesetrap/cert.pem",
  "https.key": "/run/cheesetrap/key.pem",
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {"plain": {"format": "%(message)s"}},
      "handlers": {"file": {"class": "logging.FileHandler", "filename": "/var/tmp/opencanary.log"}}
    }
  }
}
